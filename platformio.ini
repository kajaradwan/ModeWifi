[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
upload_protocol = esptool
; Uncomment and set your port if it's not automatically detected
; upload_port = /dev/ttyUSB0

; Set the partition scheme to "Huge APP" to allow for larger sketches
board_build.partitions = huge_app.csv

; Required libraries
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    https://github.com/autowp/arduino-mcp2515.git

; Enable BLE support and configure for ESP32-WROOM-32D
build_flags = 
    -DCORE_DEBUG_LEVEL=5
    -DBTDM_CTRL_MODE_BLE_ONLY=1
    -DBTDM_CTRL_MODE_BR_EDR_ONLY=0
    -DBTDM_CTRL_MODE_BTDM=0
    -DCONFIG_BTDM_CTRL_MODE_BLE_ONLY=1
    -DCONFIG_BTDM_CTRL_MODE_BR_EDR_ONLY=0
    -DCONFIG_BTDM_CTRL_MODE_BTDM=0
    -DCONFIG_BT_BLUEDROID_ENABLED=1
    -DCONFIG_BT_NIMBLE_ENABLED=0

; Set CPU frequency to 240MHz for full performance
board_build.f_cpu = 240000000L

; Set flash mode to QIO for better stability
board_build.flash_mode = qio

; Enable brownout detector
board_build.extra_flags = -DCONFIG_ESP32_BROWNOUT_DET=1 